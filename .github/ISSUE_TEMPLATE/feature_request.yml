name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
      description: >-
        How you would like it to work. deployd deploys artifacts; it is not a CI
        system, an observability stack or a secrets manager.
