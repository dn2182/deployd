name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - run: shellcheck deploy/install-ubuntu.sh deploy/uninstall-ubuntu.sh deploy/lib.sh tests/installer-smoke.sh
      # Lint, tests and audit already run in the python/web/dependency-audit jobs.
      - run: bash tests/installer-smoke.sh
        env:
          DEPLOYD_INSTALL_SKIP_CHECKS: "1"
      - if: failure()
        run: |
          sudo journalctl -u deployd -n 60 --no-pager
          for log in "$RUNNER_TEMP/deployd-install.log" "$RUNNER_TEMP/deployd-upgrade.log"; do
            if [ -f "$log" ]; then
              tail -n 60 "$log" | sed -E 's/[0-9a-f]{64}/[redacted]/g'
            fi
          done

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check src tests deploy/runtime_config.py deploy/connect_website.py
      - run: uv run ruff format --check src tests deploy/runtime_config.py deploy/connect_website.py
      - run: uv run pytest -q

  # Advisory until Windows coverage (NSSM service, junction cutover, ACLs) is complete.
  python-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -q

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python tests/render_workflow.py "$RUNNER_TEMP/rendered"
      - run: |
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/rendered:/rendered" -w /repo \
            rhysd/actionlint:1.7.7 -no-color \
            .github/workflows/ci.yml examples/github-actions-deploy.yml /rendered/.github/workflows/*.yml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - run: uv sync --extra dev --frozen
      - run: uv run --with pip-audit==2.10.1 pip-audit
      - working-directory: web
        run: pnpm audit --prod

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, python, web, dependency-audit, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: uv build
      - working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -C web -cf - dist | gzip -n > "deployd-web-${GITHUB_REF_NAME}.tar.gz"
          sha256sum dist/*.whl dist/*.tar.gz "deployd-web-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "deployd $GITHUB_REF_NAME" \
            --notes "Wheel, sdist, and built management UI for $GITHUB_REF_NAME." \
            dist/*.whl dist/*.tar.gz "deployd-web-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS
