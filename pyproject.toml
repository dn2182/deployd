[project]
name = "deployd"
version = "0.1.0"
description = "Pull-style deploy agent over HTTPS — no inbound SSH/FTP"
license = "Apache-2.0"
authors = [{name = "Daniel (dn2182)"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
deployd-migrate = "deployd.migrate:main"

[project.optional-dependencies]
mssql = ["pyodbc>=5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deployd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
